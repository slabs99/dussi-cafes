name: Sync cafes

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6am UTC
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run sync
        run: npm run sync

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/cafes.json
          if git diff --staged --quiet; then
            echo "No changes to cafes.json — skipping commit"
          else
            ADDED=$(git diff --staged --stat | grep "cafes.json" | head -1)
            git commit -m "chore: sync cafes data

$ADDED"
            git push
            echo "Pushed updated cafes.json — Vercel will redeploy automatically"
          fi
